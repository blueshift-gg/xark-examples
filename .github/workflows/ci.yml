name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: xark-examples
    steps:
      - name: Check out examples
        uses: actions/checkout@v4
        with:
          path: xark-examples

      # Until xark 0.3.0 is released, the examples build against a sibling checkout
      # (see RUNBOOK.md). Move to the release when it ships.
      - name: Check out xark
        uses: actions/checkout@v4
        with:
          repository: blueshift-gg/xark
          ref: remove-nightly-compiler
          path: xark

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          cargo install just --version 1.43.1 --locked
          cargo install wasm-pack --version 0.15.0 --locked
          cargo install cargo-build-sbf --version 4.2.0 --locked

      - name: Install xark and xark-wasm from the checkout
        run: |
          cargo install --path ../xark/crates/cli --locked
          wasm-pack build ../xark/crates/wasm --target nodejs --release --out-dir dist/node
          xark --version | grep -E '^xark 0\.3\.0 '
          npm ci
          xark doctor

      - name: Formatting
        run: just fmt-check

      - name: Circuit tests
        run: just test-circuits

      - name: Build, then prove with the clients and verify on-chain (LiteSVM)
        run: just test

      - name: Clippy
        run: just clippy

      - name: Committed clients are current
        run: just check-clients
