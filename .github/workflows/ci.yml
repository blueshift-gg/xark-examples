name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Rust toolchain itself is pinned in rust-toolchain.toml (1.95.0, with the
  # wasm32 target); these are the tools installed beside it.
  CARGO_BUILD_SBF_VERSION: 4.2.0
  XARK_CLI_VERSION: 0.4.0

jobs:
  # Neither tool has a prebuilt binary that cargo-binstall (or install-action, which
  # falls back to it) can find: no binstall metadata, nothing on quickinstall. Both
  # build from source, which takes minutes, so they build here once, and every
  # example's job restores them from this cache.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cached tools
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-build-sbf
            ~/.cargo/bin/xark
          key: tools-${{ runner.os }}-sbf-${{ env.CARGO_BUILD_SBF_VERSION }}-xark-${{ env.XARK_CLI_VERSION }}

      - name: Build cargo-build-sbf and xark
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install
          cargo install cargo-build-sbf --version "$CARGO_BUILD_SBF_VERSION" --locked
          cargo install xark-cli --version "$XARK_CLI_VERSION" --locked

  example:
    needs: tools
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One example failing says nothing about the others: let each report.
      fail-fast: false
      matrix:
        example:
          - 01-over-9000
          - 02-zkyc
          - 03-token-claim
          - 04-shielded-pool
          - 05-anonymous-voting
          - 06-shielded-transfer
    name: ${{ matrix.example }}
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      # With no arguments, rustup installs what rust-toolchain.toml names.
      - name: Rust toolchain
        working-directory: .
        run: rustup toolchain install

      - name: Tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-build-sbf
            ~/.cargo/bin/xark
          key: tools-${{ runner.os }}-sbf-${{ env.CARGO_BUILD_SBF_VERSION }}-xark-${{ env.XARK_CLI_VERSION }}
          fail-on-cache-miss: true

      # The tools come from their own cache above, so this one leaves ~/.cargo/bin
      # alone. Each example is a project: one Cargo workspace, one target.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.example }}
          workspaces: ${{ matrix.example }}
          cache-bin: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One install for every example: the root is an npm workspace.
      - name: npm packages
        working-directory: .
        run: |
          npm ci
          xark doctor

      # The committed keys and generated clients are what the source builds; the
      # programs build too (failing on a stack frame past SBF's 4 KiB).
      - name: xark build --check
        id: build
        run: xark build --check

      # The circuits' tests, the programs' and verifier crates' Rust tests, then
      # prove with the client and verify onchain (LiteSVM).
      - name: xark test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: xark test

      - name: Formatting
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
