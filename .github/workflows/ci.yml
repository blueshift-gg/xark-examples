name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: xark-examples
    steps:
      - name: Check out examples
        uses: actions/checkout@v4
        with:
          path: xark-examples

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
          cargo install just --version 1.43.1 --locked
          cargo install cargo-build-sbf --version 4.2.0 --locked

      - name: Install xark 0.3 and the npm packages
        run: |
          cargo install xark-cli --version 0.3.0 --locked
          xark --version | grep -E '^xark 0\.3\.'
          npm ci
          xark doctor

      - name: Build, then prove with the clients and verify on-chain (LiteSVM)
        run: just test

      # After the build: the programs' manifests name the generated verifier crates.
      - name: Formatting
        if: ${{ !cancelled() }} # each check reports on its own
        run: just fmt-check

      - name: Circuit tests
        if: ${{ !cancelled() }} # each check reports on its own
        run: just test-circuits

      - name: Clippy
        if: ${{ !cancelled() }} # each check reports on its own
        run: just clippy

      - name: Committed clients are current
        if: ${{ !cancelled() }} # each check reports on its own
        run: just check-clients
