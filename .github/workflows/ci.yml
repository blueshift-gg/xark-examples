name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  XARK_REV: 44f9a8d3b1f5af90a57249fa1dad308968922a03

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust tooling
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup toolchain install nightly-2026-05-03 --profile minimal --component rust-src --component rustc-dev --component llvm-tools
          cargo install just --version 1.43.1 --locked

      - name: Install pinned xark
        run: cargo +nightly-2026-05-03 install --git https://github.com/blueshift-gg/xark --rev "$XARK_REV" xark --locked --features cli

      - name: Install pinned Solana program builder
        run: cargo install cargo-build-sbf --version 4.0.0 --locked

      - name: Formatting
        run: just fmt-check

      - name: Circuit checks and tests
        run: |
          just check-circuits
          just test-circuits

      - name: Full proof and LiteSVM suite
        run: just test

      - name: Clippy
        run: just clippy
