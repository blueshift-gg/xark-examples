name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: xark-examples
    steps:
      - name: Check out examples
        uses: actions/checkout@v4
        with:
          path: xark-examples

      # Until 0.2.2 is released, examples deliberately dogfood the sibling
      # checkout through relative path dependencies.
      - name: Check out local Xark source
        uses: actions/checkout@v4
        with:
          repository: blueshift-gg/xark
          path: xark

      - name: Install Rust tooling
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup toolchain install nightly-2026-05-03 --profile minimal --component rust-src --component rustc-dev --component llvm-tools
          cargo install just --version 1.43.1 --locked

      - name: Install local Xark
        run: |
          cargo install --path ../xark/crates/cli --locked
          cargo +nightly-2026-05-03 install --path ../xark/crates/rustc --locked
          xark --version | grep -E '^xark 0\.2\.2 \([0-9a-f]{12}\)$'

      - name: Install pinned Solana program builder
        run: |
          cargo install cargo-build-sbf --version 4.0.0 --locked
          xark doctor

      - name: Formatting
        run: just fmt-check

      - name: Circuit checks and tests
        run: |
          just check-circuits
          just test-circuits

      - name: Full proof and LiteSVM suite
        run: just test

      - name: Clippy
        run: just clippy
