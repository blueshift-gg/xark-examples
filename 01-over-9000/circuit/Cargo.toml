# The "over 9000" circuit — an ordinary Rust crate that xark compiles to R1CS.
[package]
name = "over_9000"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
xark = { git = "https://github.com/blueshift-gg/xark", rev = "44f9a8d3b1f5af90a57249fa1dad308968922a03", default-features = false }

[dev-dependencies]
# For the in-crate prove-tests (`xark test`).
xark-prover = { git = "https://github.com/blueshift-gg/xark", rev = "44f9a8d3b1f5af90a57249fa1dad308968922a03" }
