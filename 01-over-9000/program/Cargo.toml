# On-chain verifier program for the "over 9000" circuit.
# Built with Pinocchio for minimal compute-unit cost — the whole program is a
# single `verify_instruction_data` call.
#
# The `over-9000-xark-verifier` dependency is GENERATED by `just export`
# (`xark export`). Run that before `cargo build-sbf`. If your local xark isn't
# published to crates.io, edit the generated crate's Cargo.toml so its
# `xark-verifier` dependency points at your xark checkout (see RUNBOOK).
[package]
name = "over-9000-program"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace so `cargo-build-sbf` resolves against this crate's own
# lock (the generated verifier crate lives under circuit/target/).
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
over_9000_xark_verifier = { path = "../circuit/target/over_9000-xark-verifier", package = "over-9000-xark-verifier" }
pinocchio = "0.8"
solana-program-error = { version = "3", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
