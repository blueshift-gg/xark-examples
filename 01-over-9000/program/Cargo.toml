# Onchain verifier program for the "over 9000" circuit.
# Built with Pinocchio for minimal compute-unit cost — the whole program is a
# single `verify` call.
#
# The `over-9000-xark-verifier` dependency is GENERATED by `just export`
# (`xark export`). Run that before `cargo build-sbf`. The generated crate depends
# on the `xark-verifier` release matching the CLI that wrote it.
[package]
name = "over-9000-program"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace so `cargo-build-sbf` resolves against this crate's own
# lock (the generated verifier crate lives beside the circuit, in circuit/).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
over_9000_xark_verifier = { path = "../circuit/over_9000-verifier", package = "over-9000-xark-verifier" }
pinocchio = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

