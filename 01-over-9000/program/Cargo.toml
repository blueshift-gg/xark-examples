# On-chain verifier program for the "over 9000" circuit.
# Built with Pinocchio for minimal compute-unit cost — the whole program is a
# single `verify_instruction_data` call.
#
# The `over-9000-xark-verifier` dependency is GENERATED by `just export`
# (`xark export`). Run that before `cargo build-sbf`. The generated crate pulls
# the verifier from the same Xark source as the CLI (the sibling checkout while
# dogfooding, an immutable revision/release once published).
[package]
name = "over-9000-program"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace so `cargo-build-sbf` resolves against this crate's own
# lock (the generated verifier crate lives under circuit/target/xark/).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
over_9000_xark_verifier = { path = "../circuit/target/xark/over_9000/verifier", package = "over-9000-xark-verifier" }
pinocchio = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
