[package]
name = "over-9000-program"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Generated by `xark export` from circuits/over-9000: rerun it (or `xark build`)
# when the circuit changes, and this is the only thing that updates.
over-9000-verifier = { path = "../../clients/over-9000/rust" }
pinocchio = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
