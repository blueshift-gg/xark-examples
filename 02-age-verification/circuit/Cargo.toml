# The age-verification circuit: an ordinary Rust crate that xark compiles to R1CS.
[package]
name = "age_verification"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
xark = { path = "../../../xark/crates/lang", version = "0.3.0" }
xark-poseidon2 = { path = "../../../xark/gadgets/xark-poseidon2", version = "0.3.0" }
xark-hash = { path = "../../../xark/gadgets/xark-hash", version = "0.3.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }
