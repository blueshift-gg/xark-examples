# The age-verification circuit — plain Rust that xark compiles to R1CS.
[package]
name = "age_verification"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../xark/crates/lang" }
# Poseidon2 as an ordinary Rust library the compiler inlines into the circuit.
xark-poseidon2 = { path = "../../../xark/gadgets/xark-poseidon2" }
