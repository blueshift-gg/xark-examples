# On-chain verifier for the age-verification circuit (Pinocchio, minimal CU).
# The `age-verification-xark-verifier` dependency is generated by `just export`.
[package]
name = "age-verification-program"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# xark-verifier isn't published yet; assumes xark is cloned as a sibling repo.
[patch.crates-io]
xark-verifier = { path = "../../../xark/crates/verifier" }

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
age_verification_xark_verifier = { path = "../circuit/target/age_verification-xark-verifier", package = "age-verification-xark-verifier" }
pinocchio = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
