# On-chain verifier for the age-verification circuit (Pinocchio, minimal CU).
# The `age-verification-xark-verifier` dependency is generated by `just export`.
[package]
name = "age-verification-program"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
age_verification_xark_verifier = { path = "../circuit/target/xark/age_verification/verifier", package = "age-verification-xark-verifier" }
pinocchio = "0.11"

# Host tests check the program's dates against the circuit's own.
[dev-dependencies]
age_verification = { path = "../circuit" }
xark = { path = "../../../xark/crates/lang", version = "0.3.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

# Until xark 0.3.0 is on crates.io: the generated verifier crate pins
# `xark-verifier = "=0.3.0"`, served here by the sibling xark checkout.
[patch.crates-io]
xark-verifier = { path = "../../../xark/crates/verifier" }
