# Onchain verifier for the zkyc circuit (Pinocchio, minimal CU).
# The `zkyc-xark-verifier` dependency is generated by `npm run build` (`xark export`).
[package]
name = "zkyc-program"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zkyc_xark_verifier = { path = "../circuit/zkyc-verifier", package = "zkyc-xark-verifier" }
pinocchio = "0.11"

# Host tests check the program's policy against the circuit's own.
[dev-dependencies]
zkyc = { path = "../circuit" }
xark = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
