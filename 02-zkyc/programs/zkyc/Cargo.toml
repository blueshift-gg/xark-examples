# Onchain verifier for the zkyc circuit (Pinocchio, minimal CU).
[package]
name = "zkyc-program"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Generated by `xark build` (`xark export`) from circuits/zkyc: rerun it when the
# circuit changes, and this is the only thing that updates.
zkyc-verifier = { path = "../../clients/zkyc/rust" }
pinocchio = "0.11"

# Host tests check the program's policy against the circuit's own.
[dev-dependencies]
zkyc = { path = "../../circuits/zkyc" }
xark = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
