# Shared Merkle-tree gadget for the pool's two circuits — an ordinary Rust
# library the xark compiler inlines, exactly like xark's own gadget crates.
[package]
name = "pool-merkle"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
xark = { path = "../../../../xark/crates/lang" }
xark-poseidon2 = { path = "../../../../xark/gadgets/xark-poseidon2" }
