[package]
name = "shielded-pool"
version = "0.1.0"
edition = "2021"
description = "Reference shielded-pool program verifying xark Groth16 proofs (unaudited)."

[lib]
crate-type = ["cdylib", "lib"]
name = "shielded_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1"

# Generated by `just export` (one per circuit). Until xark-verifier is
# published, add a [patch.crates-io] for xark-verifier in the workspace
# Cargo.toml pointing at your xark checkout (see below).
shielded_pool_deposit_xark_verifier = { path = "../../../circuits/deposit/target/shielded_pool_deposit-xark-verifier", package = "shielded-pool-deposit-xark-verifier" }
shielded_pool_withdraw_xark_verifier = { path = "../../../circuits/withdraw/target/shielded_pool_withdraw-xark-verifier", package = "shielded-pool-withdraw-xark-verifier" }
