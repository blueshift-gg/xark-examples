[package]
name = "shielded-pool"
version = "0.1.0"
edition = "2021"
description = "Reference shielded-pool program verifying xark Groth16 proofs (unaudited)."

[lib]
crate-type = ["cdylib"]
name = "shielded_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1"

# Generated by `xark export` (one per circuit) from the same Xark source as the
# CLI.
shielded_pool_deposit_xark_verifier = { path = "../../../circuits/deposit/target/xark/shielded_pool_deposit/verifier", package = "shielded-pool-deposit-xark-verifier" }
shielded_pool_withdraw_xark_verifier = { path = "../../../circuits/withdraw/target/xark/shielded_pool_withdraw/verifier", package = "shielded-pool-withdraw-xark-verifier" }

# Declare Anchor's macro-emitted cfg probes so check-cfg stays quiet.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug", "no-log-ix-name"))',
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
