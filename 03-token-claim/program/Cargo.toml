# Onchain half of the token claim (Pinocchio): the distributor, its vault, and the
# claims. The `token-claim-xark-verifier` dependency is generated by `npm run build`
# (`xark export`).
[package]
name = "token-claim-program"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
token_claim_xark_verifier = { path = "../circuit/token_claim-verifier", package = "token-claim-xark-verifier" }
pinocchio = "0.11"
pinocchio-system = "0.6"
pinocchio-token = "0.7"

# Onchain, PDAs come from the runtime's syscalls; a host build (clippy, the tests)
# derives them in software.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
