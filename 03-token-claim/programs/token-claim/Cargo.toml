# Onchain half of the token claim (Pinocchio): the distributor, its vault, and the
# claims.
[package]
name = "token-claim-program"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Generated by `xark build` from circuits/token-claim: rebuild when the circuit
# changes, and this is the only thing that updates.
token-claim-verifier = { path = "../../clients/token-claim/rust" }
pinocchio = "0.11"
pinocchio-system = "0.6"
pinocchio-token = "0.7"

# Onchain, PDAs come from the runtime's syscalls; a host build (clippy, the tests)
# derives them in software.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
