# What the pool's circuits share, and 06's: an ordinary Rust library, compiled
# into each circuit like xark's own gadget crates. It has no `#[circuit]`, so
# xark builds it only as part of the circuits that use it.
[package]
name = "pool"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
xark = "0.4"
xark-merkle = "0.4"
xark-poseidon2 = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xark)'] }
