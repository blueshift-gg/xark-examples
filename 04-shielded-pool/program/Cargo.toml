# The shielded pool's onchain program (Pinocchio): verifies the deposit and
# withdraw proofs, holds and pays lamports, tracks roots and nullifiers.
# The two verifier crates are generated by `just build` (`xark export`).
[package]
name = "shielded-pool-program"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace so `cargo-build-sbf` resolves against this crate's own
# lock (the generated verifier crates live beside the circuits).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
shielded_pool_deposit_xark_verifier = { path = "../circuits/deposit/shielded_pool_deposit-verifier", package = "shielded-pool-deposit-xark-verifier" }
shielded_pool_withdraw_xark_verifier = { path = "../circuits/withdraw/shielded_pool_withdraw-verifier", package = "shielded-pool-withdraw-xark-verifier" }
pinocchio = "0.11"
pinocchio-system = "0.6"

# Onchain, `Address::find_program_address` is a syscall; on the host (the tests)
# it hashes and checks the curve itself, which needs this feature.
[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
