# Shielded transfer — the JoinSplit `transact` circuit crate (Rust → R1CS).
[package]
name = "shielded_transact"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
xark = { git = "https://github.com/blueshift-gg/xark", rev = "44f9a8d3b1f5af90a57249fa1dad308968922a03", default-features = false }
xark-poseidon2 = { git = "https://github.com/blueshift-gg/xark", rev = "44f9a8d3b1f5af90a57249fa1dad308968922a03" }
# 03's Merkle gadget, reused as an ordinary crate — same tree, same hash,
# same zero constants. Gadget reuse is the point of circuits-as-Rust.
pool-merkle = { path = "../../../03-shielded-pool/circuits/merkle" }
