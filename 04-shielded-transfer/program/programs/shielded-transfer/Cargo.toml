[package]
name = "shielded-transfer"
version = "0.1.0"
edition = "2021"
description = "Reference shielded-transfer program (Sapling/JoinSplit on Solana via xark). Unaudited."

[lib]
crate-type = ["cdylib", "lib"]
name = "shielded_transfer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1"
anchor-spl = "1.1"
# Generated by `xark export` from circuits/transact.
shielded_transfer_transact_xark_verifier = { path = "../../../circuits/transact/target/shielded_transact-xark-verifier", package = "shielded-transfer-transact-xark-verifier" }
