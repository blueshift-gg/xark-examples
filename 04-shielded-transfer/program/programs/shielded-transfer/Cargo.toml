[package]
name = "shielded-transfer"
version = "0.1.0"
edition = "2021"
description = "Reference shielded-transfer program (Sapling/JoinSplit on Solana via xark). Unaudited."

[lib]
crate-type = ["cdylib", "lib"]
name = "shielded_transfer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1"
anchor-spl = "1.1"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }
# Generated by `xark export` from circuits/transact; the justfile pins its
# xark-verifier dependency to the repository-wide xark revision.
shielded_transfer_transact_xark_verifier = { path = "../../../circuits/transact/target/xark/shielded_transact/verifier", package = "shielded-transfer-transact-xark-verifier" }

# Declare Anchor's macro-emitted cfg probes so check-cfg stays quiet.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug", "no-log-ix-name"))',
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
