# The shielded-transfer pool onchain (Pinocchio + SPL). Unaudited.
# The `shielded-transfer-transact-xark-verifier` dependency is generated by
# `npm run build` (`xark export`).
[package]
name = "shielded-transfer"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace so `cargo-build-sbf` resolves against this crate's own
# lock (the generated verifier crate lives beside the circuit).
[workspace]

[lib]
crate-type = ["cdylib"]
name = "shielded_transfer"

[dependencies]
shielded_transfer_transact_xark_verifier = { path = "../circuits/transact/shielded_transact-verifier", package = "shielded-transfer-transact-xark-verifier" }
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6"
pinocchio-token = "0.7"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

# Host tests derive PDAs off-chain, which needs the curve arithmetic.
[dev-dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
# Amounts and indices use checked arithmetic explicitly; this catches any that
# don't, as the Anchor version's profile did.
overflow-checks = true
