# The shielded-transfer pool onchain (Pinocchio + SPL). Unaudited.
[package]
name = "shielded-transfer-program"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Generated by `xark export` from circuits/shielded_transact: rerun it (or `xark
# build`) when the circuit changes, and this is the only thing that updates.
shielded-transact-verifier = { path = "../../clients/shielded_transact/rust" }
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6"
pinocchio-token = "0.7"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

# Host tests derive PDAs off-chain, which needs the curve arithmetic.
[dev-dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
