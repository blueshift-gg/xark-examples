# Circuits, host tests, formatting and linting use this stable toolchain (xark
# needs 1.89 or later and compiles the same circuit on every version), with the
# wasm32 target `xark build` compiles circuits to; cargo-build-sbf brings its own
# Solana platform toolchain.
[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown"]
