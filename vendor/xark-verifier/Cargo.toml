[package]
name = "xark-verifier"
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/blueshift-gg/xark"
rust-version = "1.85"
description = "Pinned xark Solana Groth16 verifier with dynamic syscalls for LiteSVM compatibility."
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
solana-nostd-alt-bn128 = { version = "0.1.1", default-features = false }
solana-program-error = { version = "3", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(kani)',
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
